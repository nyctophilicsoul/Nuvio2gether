name: Android Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - Test-Build
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "androidApp/**"
      - "composeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Test-Build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio2gether-test-build
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
